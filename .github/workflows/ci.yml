name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
            Mobile/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Typecheck backend
        working-directory: Backend
        run: npm run typecheck

      - name: Install mobile dependencies
        working-directory: Mobile
        run: npm ci

      - name: Verify mobile code and release configuration
        working-directory: Mobile
        run: |
          npm run typecheck
          npm run lint
          npm run check:release

      - name: Export mobile bundles
        working-directory: Mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          EXPO_PUBLIC_API_URL: https://example.com
        run: npx expo export --platform all

      - name: Typecheck frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build backend
        working-directory: Backend
        run: npm run build

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Audit backend dependencies
        working-directory: Backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: Frontend
        run: npm audit --audit-level=high
