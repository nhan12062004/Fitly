name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
            Mobile/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Typecheck backend
        working-directory: Backend
        run: npm run typecheck

      - name: Test security, database transactions and account cache
        working-directory: Backend
        env:
          NODE_ENV: test
          ENABLE_JOBS: 'false'
        run: npm test

      - name: Install mobile dependencies
        working-directory: Mobile
        run: npm ci

      - name: Verify mobile code and release configuration
        working-directory: Mobile
        run: |
          npm run typecheck
          npm run lint
          npm run check:release

      - name: Export mobile bundles
        working-directory: Mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          EXPO_PUBLIC_API_URL: https://example.com
        run: npx expo export --platform all

      - name: Typecheck frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build backend
        working-directory: Backend
        run: npm run build

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Audit backend dependencies
        working-directory: Backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: Frontend
        run: npm audit --audit-level=high

      - name: Install Chromium
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Test web account flows
        working-directory: Frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: http://127.0.0.1:5001
        run: npm run test:e2e

  supabase-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci
      - name: Start isolated Supabase and apply migrations
        run: supabase start
      - name: Test database ownership
        run: supabase test db --local supabase/tests/rls_ownership_test.sql
      - name: Write local connection information without logging keys
        run: supabase status -o json > /tmp/fitly-supabase-local.json
      - name: Test local Auth, Data API, Storage and account lifecycle
        working-directory: Backend
        env:
          SUPABASE_LOCAL_STATUS_FILE: /tmp/fitly-supabase-local.json
        run: npm run test:integration:local
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
